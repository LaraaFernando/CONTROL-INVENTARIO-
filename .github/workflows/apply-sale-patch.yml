name: Aplicar integración venta multiproducto

on:
  push:
    branches: [codex/venta-multiproducto]
    paths:
      - ".github/workflows/apply-sale-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: codex/venta-multiproducto
          fetch-depth: 0

      - name: Aplicar parche
        run: |
          set -euo pipefail
          git apply --check patches/venta-multiproducto.patch
          git apply patches/venta-multiproducto.patch
          git diff --check

      - name: Guardar integración
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inventory-app.tsx
          git commit -m "Integrar venta multiproducto en la interfaz"
          git push origin HEAD:codex/venta-multiproducto
