name: Construir APK Android

on:
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Generar APK instalable
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk CIV-Android.apk
          test -s CIV-Android.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CIV-Android-APK
          path: CIV-Android.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publicar APK descargable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-v1.0.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CIV-Android.apk --clobber
          else
            gh release create "$TAG" CIV-Android.apk \
              --title "CIV Android v1.0.0" \
              --notes "APK instalable de CIV para Android. La app se conecta a la misma producción de CIV en Cloudflare, por lo que comparte usuarios, inventario, clientes, pedidos y ventas con iPhone y web."
          fi
