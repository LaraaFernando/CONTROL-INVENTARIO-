name: Verificar aplicación web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código
        run: npm run lint

      - name: Compilar y ejecutar pruebas
        run: npm test
