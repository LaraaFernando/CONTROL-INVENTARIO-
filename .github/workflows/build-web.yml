name: Verificar aplicación web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código
        run: npm run lint

      - name: Compilar y ejecutar pruebas
        run: npm test

      - name: Verificar versión publicada en Cloudflare
        if: github.event_name == 'pull_request'
        env:
          PROD_URL: https://control-inventario.laraafernando.workers.dev
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n ' < public/release.json)"
          echo "Comprobando la versión servida por el Worker real..."
          for attempt in $(seq 1 18); do
            actual="$(curl -fsS --connect-timeout 10 --max-time 20 "$PROD_URL/release.json" 2>/dev/null | tr -d '\r\n ' || true)"
            if [ "$actual" = "$expected" ]; then
              curl -fsS --connect-timeout 10 --max-time 20 "$PROD_URL/" >/dev/null
              echo "Producción verificada: $PROD_URL"
              echo "Release confirmado: $actual"
              exit 0
            fi
            echo "Intento $attempt/18: producción todavía no sirve la versión esperada."
            sleep 10
          done
          echo "::error::La versión del Worker no coincide con public/release.json."
          exit 1
