name: Verificar aplicación web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verificar-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código
        run: npm run lint

      - name: Compilar y ejecutar pruebas
        run: npm test

      - name: Verificar versión publicada en Cloudflare
        id: production_check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROD_URL: https://control-inventario.laraafernando.workers.dev
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n ' < public/release.json)"
          echo "Esperando que Cloudflare publique la versión integrada en main..."
          for attempt in $(seq 1 30); do
            actual="$(curl -fsS --connect-timeout 10 --max-time 20 "$PROD_URL/release.json" 2>/dev/null | tr -d '\r\n ' || true)"
            if [ "$actual" = "$expected" ]; then
              curl -fsS --connect-timeout 10 --max-time 20 "$PROD_URL/" >/dev/null
              echo "Producción verificada: $PROD_URL"
              echo "Release confirmado: $actual"
              exit 0
            fi
            echo "Intento $attempt/30: la versión productiva todavía no coincide."
            sleep 10
          done
          echo "::error::Cloudflare no publicó la versión esperada de public/release.json dentro del tiempo de espera."
          exit 1

      - name: Publicar estado de producción en el commit
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.production_check.outcome }}
          PROD_URL: https://control-inventario.laraafernando.workers.dev
        run: |
          set -euo pipefail
          if [ "$CHECK_OUTCOME" = "success" ]; then
            state="success"
            description="Cloudflare sirve la release integrada en main"
          else
            state="failure"
            description="Cloudflare todavía no sirve la release integrada"
          fi
          payload="$(node -e 'const [state,description,target_url]=process.argv.slice(1); process.stdout.write(JSON.stringify({state,context:"cloudflare-production",description,target_url}))' "$state" "$description" "$PROD_URL")"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
